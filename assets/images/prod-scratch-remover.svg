<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="170" y="40" width="60" height="30" rx="4" fill="#AD1457"/>
    <rect x="175" y="30" width="50" height="15" rx="7" fill="#ddd"/>
    <rect x="150" y="70" width="100" height="240" rx="16" fill="url(#bottle)"/>
    <rect x="155" y="140" width="90" height="70" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="200" y="180" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">SCRATCH REMOVER</text>
    <text x="200" y="240" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial,sans-serif" font-size="28">🔧</text>
  </g>
</svg>
