<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#2e0a0a"/>
    </linearGradient>
    <linearGradient id="shadeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="shadowC"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bgC)"/>
  <g filter="url(#shadowC)">
    <rect x="90" y="110" width="220" height="180" rx="8" fill="url(#shadeg)"/>
    <rect x="100" y="120" width="200" height="160" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="120" y="170" width="160" height="50" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="200" y="200" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">SUN SHADE</text>
    <text x="200" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial,sans-serif" font-size="28">☀️</text>
  </g>
</svg>
